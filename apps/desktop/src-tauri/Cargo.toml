[package]
name = "kabaad-to-karodpati"
version = "0.1.0"
description = "Desi Auto & Scrap Empire Simulator"
authors = ["Kabaad to Karodpati Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["fs-all", "shell-all", "dialog-all", "notification-all", "os-all", "clipboard-all", "path-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }